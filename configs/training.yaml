totalTokens: 12_000_000_000
seqLen: 4096

# Values below are for Kaggle dual T4:
#   effectiveBatch = microBatchPerChip * nChips * gradAccumSteps = 128
#   tokensPerStep = 128 * 4096 = 524,288
microBatchPerChip: 1
nChips: 2
gradAccumSteps: 128

optimizer:
  name: adamw
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  weightDecay: 0.01
  gradClipNorm: 1.0

schedule:
  peakLR: 3.0e-4
  minLR: 3.0e-5
  warmupFraction: 0.01
  decay: cosine

checkpoint:
  intervalMinutes: 15
  weightsRepo: "zephyros-600m"
